<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Talla Fetal</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const CalculadoraTallaFetal = () => {
            const [femurLength, setFemurLength] = React.useState('');
            const [result, setResult] = React.useState(null);
            const [error, setError] = React.useState('');

            const calculateFetalHeight = () => {
                const length = parseFloat(femurLength);
                if (isNaN(length) || length <= 0) {
                    setError('Por favor, ingrese un valor válido.');
                    setResult(null);
                    return;
                }

                const fetalHeight = ((0.55 * length) + 8.358).toFixed(2);
                setResult(fetalHeight);
                setError('');
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-purple-100 flex flex-col items-center justify-center p-4 font-sans">
                    <div className="w-full max-w-md bg-white bg-opacity-80 backdrop-blur-lg rounded-3xl shadow-lg overflow-hidden mb-8">
                        <div className="p-8">
                            <h1 className="text-3xl font-semibold text-gray-800 mb-6 text-center">Calculadora de Talla Fetal</h1>
                            
                            <div className="mb-6">
                                <label htmlFor="femurLength" className="block text-sm font-medium text-gray-700 mb-2">
                                    Longitud del Fémur (mm):
                                </label>
                                <input
                                    type="number"
                                    id="femurLength"
                                    value={femurLength}
                                    onChange={(e) => setFemurLength(e.target.value)}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out"
                                    placeholder="Ingrese la longitud en milímetros"
                                />
                            </div>

                            <button
                                onClick={calculateFetalHeight}
                                className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium py-2 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out transform hover:scale-105"
                            >
                                Calcular Talla Fetal
                            </button>

                            {error && (
                                <div className="mt-4 flex items-center text-red-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                                        <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd" />
                                    </svg>
                                    <span>{error}</span>
                                </div>
                            )}

                            {result && (
                                <div className="mt-6 text-lg font-semibold text-center text-indigo-600">
                                    Talla fetal estimada: {result} cm
                                </div>
                            )}
                        </div>
                    </div>
                    <footer className="text-center text-sm text-gray-600">
                        Todos los derechos reservados a MiMaternofetal.cl
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<CalculadoraTallaFetal />, document.getElementById('root'));
    </script>
</body>
</html>
